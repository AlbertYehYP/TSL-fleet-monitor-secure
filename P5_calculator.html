<title>🔒 P5 快速試算</title>
<style>
 :root{--bg:#0A141D;--panel:#111F2C;--grid:#2B4356;--ink:#EDF4F7;--soft:#A8BDCB;--cal:#8FB4D9;--ok:#3BD6A5;--err:#FF5D52}
 *{box-sizing:border-box}html,body{margin:0;height:100%}
 body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
   display:flex;align-items:center;justify-content:center;min-height:100vh}
 .card{background:var(--panel);border:1px solid var(--grid);border-radius:16px;padding:34px 30px;width:min(92vw,380px);
   box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center}
 .lock{font-size:34px}
 .brand{font-size:10.5px;font-weight:800;letter-spacing:.28em;color:var(--cal);margin-top:8px}
 h1{font-size:17px;margin:6px 0 2px}
 .sub{font-size:12px;color:var(--soft);margin-bottom:20px;line-height:1.6}
 input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--grid);background:#0A141D;color:var(--ink);
   font-size:15px;text-align:center;letter-spacing:.05em;outline:none}
 input:focus{border-color:var(--cal)}
 button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--cal);color:#0A141D;
   font-size:15px;font-weight:800;cursor:pointer}
 button:disabled{opacity:.55;cursor:default}
 .err{color:var(--err);font-size:12.5px;font-weight:700;min-height:18px;margin-top:12px}
 .foot{font-size:10.5px;color:var(--soft);margin-top:18px;line-height:1.6}
</style></head><body>

  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
  return new TextDecoder().decode(plain);
}
function render(html){document.open();document.write(html);document.close();}
async function submit(){
  const pw=$("pw").value; if(!pw)return;
  $("err").textContent="";$("go").disabled=true;$("go").textContent="解密中…";
  try{ const html=await unlock(pw); sessionStorage.setItem(K,pw); render(html); }
  catch(e){ $("go").disabled=false;$("go").textContent="解鎖"; $("err").textContent="密碼錯誤,請再試一次。"; $("pw").select(); }
}
$("go").addEventListener("click",submit);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
window.addEventListener("DOMContentLoaded",async()=>{
  const saved=sessionStorage.getItem(K);
  if(saved){ try{ const html=await unlock(saved); render(html); return; }catch(e){ sessionStorage.removeItem(K); } }
  $("pw").focus();
});
