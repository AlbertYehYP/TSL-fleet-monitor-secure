const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:ITER,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function stamp(){try{sessionStorage.setItem(TK,Date.now())}catch(e){}}
function render(html){document.open();document.write(html);document.close();}
const $=id=>document.getElementById(id);
async function submit(){
  $("err").textContent="";
  try{ const html=await unlock($("pw").value); sessionStorage.setItem(K,$("pw").value); stamp(); render(html); }
  catch(e){ $("err").textContent=(e&&e.name==="OperationError")?"密碼錯誤,請重試":("載入發生錯誤,請重試:"+((e&&e.message)||e)); }
}
$("go").addEventListener("click",submit);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
window.addEventListener("DOMContentLoaded",async()=>{
  const saved=sessionStorage.getItem(K), last=+sessionStorage.getItem(TK)||0;
  if(saved){
    if((Date.now()-last)<IDLE){
      try{ const html=await unlock(saved); stamp(); render(html); return; }
      catch(e){ if(e && e.name==="OperationError"){ sessionStorage.removeItem(K); sessionStorage.removeItem(TK); } }
      /* 非密碼錯(e.g. 暫時性):保留 key,落到下方顯示閘門供重試,不強制重登迴圈 */
    } else { sessionStorage.removeItem(K); sessionStorage.removeItem(TK); }
  }
  $("pw").focus();
});
