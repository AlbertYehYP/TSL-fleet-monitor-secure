<meta name="viewport" content="width=device-width,initial-scale=1"><title>系統首頁 / 分頁選單</title>
<style>
 :root{--bg:#0A141D;--panel:#111F2C;--grid:#2B4356;--ink:#EDF4F7;--inkSoft:#A8BDCB;--cal:#8FB4D9;--class:#3BD6A5}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
 .box{max-width:360px;margin:0 auto;padding:18vh 24px;text-align:center}
 .brand{font-size:11px;font-weight:800;letter-spacing:.28em;color:var(--cal)}
 h1{font-size:20px;margin:8px 0 18px}
 input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--grid);background:#0d1a26;color:var(--ink);font-size:15px;text-align:center;letter-spacing:.1em}
 button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--class);color:#062018;font-weight:800;font-size:15px;cursor:pointer}
 .err{color:#F2A0A0;font-size:12.5px;min-height:18px;margin-top:10px}
 .hint{color:var(--inkSoft);font-size:11.5px;margin-top:14px;line-height:1.6}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:ITER,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function stamp(){try{sessionStorage.setItem(TK,Date.now())}catch(e){}}
function render(html){document.open();document.write(html);document.close();}
const $=id=>document.getElementById(id);
async function submit(){
  $("err").textContent="";
  try{ const html=await unlock($("pw").value); sessionStorage.setItem(K,$("pw").value); stamp(); render(html); }
  catch(e){ $("err").textContent="密碼錯誤,請重試"; }
}
$("go").addEventListener("click",submit);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
window.addEventListener("DOMContentLoaded",async()=>{
  const saved=sessionStorage.getItem(K), last=+sessionStorage.getItem(TK)||0;
  if(saved && (Date.now()-last)<IDLE){ try{ const html=await unlock(saved); stamp(); render(html); return; }catch(e){ sessionStorage.removeItem(K);} }
  if(saved){ sessionStorage.removeItem(K); sessionStorage.removeItem(TK); }
  $("pw").focus();
});
